<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游英语-Tourism English</title>
<style>
  :root {
    --bg: #eef7f8; --card: #ffffff; --ink: #1f2937; --muted: #64748b; --line: #dbe7ea;
    --ui: #0e7490;    --ui-bg: #e0f2f5;
    --agent: #7c3aed; --agent-bg: #f3edff;
    --modeA: #0d9488; --modeA-bg: #e7f7f5;
    --modeB: #ea580c; --modeB-bg: #fef1e8;
    --export: #f97316; --export-bg: #fff3e8;
    --home: #334155; --home-bg: #f1f5f9;
    --sun: #f97316; --sky: #38bdf8; --sand: #fdf3e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 14% 14%, rgba(56,189,248,.16), transparent 42%),
      radial-gradient(circle at 88% 88%, rgba(249,115,22,.13), transparent 46%),
      linear-gradient(160deg, #e8f7fb 0%, #f2fafb 42%, #fdf3e6 100%);
    color: var(--ink);
    padding: 40px 20px 60px; -webkit-font-smoothing: antialiased;
  }
  .sheet {
    max-width: 1280px; margin: 0 auto; background: var(--card);
    border-radius: 18px; box-shadow: 0 12px 40px rgba(28,35,51,.10);
    padding: 40px 44px 52px;
  }

  /* ---------- 旅行主题横幅 ---------- */
  .travel-hero {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    border-radius: 14px; padding: 20px 24px; margin-bottom: 20px;
    background: linear-gradient(120deg, #0e7490 0%, #0d9488 30%, #38bdf8 68%, #fb923c 100%);
    color: #fff; box-shadow: 0 10px 26px rgba(14,116,144,.28);
    position: relative; overflow: hidden;
  }
  .travel-hero::after {
    content: ''; position: absolute; right: 168px; top: -38px; width: 94px; height: 94px;
    border-radius: 50%; background: rgba(255,255,255,.26);
  }
  .hero-left { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .hero-logo { width: 48px; height: 48px; border-radius: 13px; background: rgba(255,255,255,.24); font-size: 25px; display: flex; align-items: center; justify-content: center; }
  .hero-title { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .hero-tag { font-size: 12.5px; opacity: .95; margin-top: 3px; }
  .hero-route { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; position: relative; z-index: 1; }
  .hero-route .stop { background: rgba(15,23,42,.20); padding: 5px 12px; border-radius: 20px; }
  .hero-route .dash { width: 20px; height: 2px; background: rgba(255,255,255,.65); border-radius: 2px; }
  .admin-link {
    margin-left: 8px; display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.20); border: 1px solid rgba(255,255,255,.55);
    color: #fff; font-size: 12.5px; font-weight: 700; padding: 5px 13px; border-radius: 999px;
    text-decoration: none; transition: all .15s; white-space: nowrap;
  }
  .admin-link:hover { background: rgba(255,255,255,.32); }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: .5px; }
  header .sub { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.7; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 22px 0 34px; font-size: 13px; color: var(--muted); }
  .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; font-size: 16px; font-weight: 800; }
  .section-title .badge { font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; border-radius: 7px; color: #fff; }
  .section-title .en { font-weight: 400; color: var(--muted); font-size: 12px; }

  .arrow { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 12px; padding: 8px 0; }
  .arrow .stem { width: 2px; height: 24px; background: #b7bfcc; margin-top: 3px; }
  .arrow .head { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid #b7bfcc; }
  .arrow.h { flex-direction: row; gap: 6px; padding: 0 2px; }
  .arrow.h .stem { width: 16px; height: 2px; margin-top: 0; }
  .arrow.h .head { border-left: 7px solid #b7bfcc; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: none; }

  /* ---------- 首页 ---------- */
  .homepage { border: 1.5px solid var(--home); border-radius: 14px; background: var(--home-bg); padding: 18px 20px; }
  .browser { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
  .browser .bar {
    display: flex; align-items: center; gap: 7px; padding: 8px 12px;
    background: #eef1f5; border-bottom: 1px solid var(--line);
  }
  .browser .bar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .browser .bar .url {
    flex: 1; margin-left: 8px; font-size: 11px; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 0 6px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(124,58,237,.35);
  }
  .brand .name { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .brand .slogan { font-size: 12px; color: var(--muted); text-align: center; margin-top: 3px; }
  .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 20px 20px; }
  .home-card {
    border-radius: 12px; padding: 16px 18px; cursor: pointer; position: relative;
    border: 1.5px solid; transition: none;
  }
  .home-card .icon { font-size: 26px; }
  .home-card .t { font-size: 16px; font-weight: 800; margin: 8px 0 4px; }
  .home-card .d { font-size: 12px; line-height: 1.55; opacity: .82; }
  .home-card .enter {
    display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 6px; color: #fff;
  }
  .home-card.a { border-color: var(--modeA); background: #fff; color: var(--modeA); }
  .home-card.a .enter { background: var(--modeA); }
  .home-card.b { border-color: var(--modeB); background: #fff; color: var(--modeB); }
  .home-card.b .enter { background: var(--modeB); }

  /* ---------- 输入区 ---------- */
  .node { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 12px 14px; position: relative; }
  .node .n { position: absolute; top: -9px; left: 12px; font-size: 11px; font-weight: 800; color: #fff; padding: 2px 8px; border-radius: 6px; letter-spacing: .5px; }
  .node .t { font-weight: 800; font-size: 14px; margin-top: 4px; }
  .node .d { color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 4px; }

  /* ---------- 创作页三栏 ---------- */
  .creation { border: 1.5px solid var(--ui); border-radius: 14px; background: var(--ui-bg); padding: 16px 18px; }
  .three-col { display: grid; grid-template-columns: 210px 1fr 280px; gap: 12px; padding: 14px 0 2px; }
  .col { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 11px 12px; display: flex; flex-direction: column; min-height: 280px; }
  .col .col-title { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .3px; margin-bottom: 9px; display: flex; align-items: center; gap: 5px; }
  .col .col-title .cnt { margin-left: auto; font-size: 10px; color: #9aa3b2; font-weight: 600; }

  .proj { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fbfcfe; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all .15s; }
  .proj:hover { border-color: var(--ui); background: var(--ui-bg); }
  .proj.cur { border-color: var(--ui); background: var(--ui-bg); box-shadow: 0 0 0 2px rgba(14,116,144,.12); }
  .proj .p-ico { flex: none; font-size: 20px; line-height: 1; }
  .proj .p-txt { flex: 1; min-width: 0; }
  .proj .pname { font-size: 13px; font-weight: 700; }
  .proj .pmeta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .proj .play { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ui); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .proj.cur .play { background: var(--export); }
  .new-btn { margin-top: auto; border: 1.5px dashed var(--ui); color: var(--ui); border-radius: 8px; padding: 7px; text-align: center; font-size: 12px; font-weight: 700; }

  .preview { flex: 1; background: #0b0c12; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .preview video { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  .preview .tag {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(14,116,144,.92); color: #fff; font-size: 11px; font-weight: 700;
    padding: 4px 11px; border-radius: 20px; pointer-events: none; letter-spacing: .3px;
  }
  .preview .hint {
    position: absolute; inset: 0; z-index: 1; display: none;
    align-items: center; justify-content: center;
    color: #cbd2dd; font-size: 12px; letter-spacing: 1px;
  }
  .preview .subtitle {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 3;
    text-align: center; font-size: 14px; line-height: 1.5; color: #fff; font-weight: 600;
    background: rgba(0,0,0,.62); padding: 7px 13px; border-radius: 7px;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none;
  }

  .shot-strip { display: flex; gap: 7px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .shot { flex: 0 0 auto; width: 58px; text-align: center; cursor: pointer; }
  .shot .shot-thumb {
    height: 34px; border-radius: 7px; border: 1.5px solid var(--line);
    background: #f1f3f7; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--muted);
  }
  .shot.cur .shot-thumb { border-color: var(--ui); background: var(--ui-bg); color: var(--ui); box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
  .shot .shot-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .toolbar .btn {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 7px;
    padding: 4px 9px; font-size: 11px; font-weight: 600; color: var(--muted);
    background: #fff; cursor: pointer; white-space: nowrap;
  }
  .toolbar .btn .ico { font-size: 13px; line-height: 1; }
  .toolbar .btn.on { border-color: var(--ui); color: var(--ui); background: var(--ui-bg); }
  .toolbar .btn.primary { background: var(--sun); color: #fff; border-color: var(--sun); }
  .toolbar .spacer { flex: 1; }
  .toolbar .toggle { display: inline-block; width: 20px; height: 11px; border-radius: 6px; background: #cbd2dd; position: relative; }
  .toolbar .btn.on .toggle { background: var(--ui); }
  .toolbar .toggle::after { content:''; position:absolute; top:1.5px; left:1.5px; width:8px; height:8px; border-radius:50%; background:#fff; }
  .toolbar .btn.on .toggle::after { left:10.5px; }

  .chat { flex: 1; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .msg { font-size: 11.5px; line-height: 1.5; padding: 7px 9px; border-radius: 9px; max-width: 92%; }
  .msg.ai { background: #f1f3f7; align-self: flex-start; }
  .msg.user { background: var(--ui); color: #fff; align-self: flex-end; }
  .chat-input { margin-top: auto; display: flex; gap: 6px; }
  .chat-input .box { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 11px; color: var(--muted); background: #fbfcfe; }
  .chat-input .send { border: none; border-radius: 8px; background: var(--ui); color: #fff; font-size: 11px; font-weight: 700; padding: 0 12px; display: flex; align-items: center; justify-content: center; }
  .quiz { display: flex; flex-direction: column; gap: 8px; }
  .quiz-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe; padding: 9px 11px; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; transition: all .15s; text-decoration: none; }
  .quiz-btn:hover { border-color: var(--ui); background: var(--ui-bg); }
  .quiz-btn .q-ico { font-size: 15px; line-height: 1; }
  .quiz-btn .q-go { margin-left: auto; color: var(--muted); font-size: 15px; font-weight: 800; }

  /* ---------- Agent 管线 ---------- */
  .pipeline { display: flex; align-items: stretch; gap: 6px; }
  .pipe-node { flex: 1; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 12px 12px 10px; position: relative; min-width: 0; }
  .pipe-node .n { position: absolute; top: -9px; left: 12px; font-size: 11px; font-weight: 800; color: #fff; padding: 2px 8px; border-radius: 6px; letter-spacing: .5px; background: var(--agent); }
  .pipe-node .t { font-weight: 800; font-size: 13.5px; margin-top: 4px; line-height: 1.3; }
  .pipe-node .d { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 4px; }
  .pipe-node.hl { border-color: var(--agent); background: var(--agent-bg); }

  .branch { margin-top: 14px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 14px; background: #fbfcfe; }
  .branch .lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .branch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .branch-item { border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .branch-item b { display: block; font-size: 13px; margin-bottom: 3px; }
  .branch-item.a { background: var(--modeA-bg); border: 1px solid #b5e6e0; }
  .branch-item.b { background: var(--modeB-bg); border: 1px solid #fbd5bf; }

  .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .export-node { border-radius: 12px; padding: 14px 16px; background: #fff; border: 1.5px solid var(--export); }
  .export-node .n { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--export); padding: 2px 8px; border-radius: 6px; }
  .export-node .t { font-weight: 800; font-size: 15px; margin-top: 6px; }
  .export-node .d { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin-top: 5px; }

  @media (max-width: 860px) {
    .pipeline { flex-direction: column; }
    .home-cards, .export-row, .branch-grid { grid-template-columns: 1fr; }
    .sheet { padding: 28px 20px; }
  }
</style>
</head>

    function bindShots() {
      var shots = Array.prototype.slice.call(strip.querySelectorAll('.shot'));
      function setCur(idx) {
        shots.forEach(function (s, i) { s.classList.toggle('cur', i === idx); });
      }
      shots.forEach(function (s) {
        s.addEventListener('click', function () {
          var t = parseFloat(s.getAttribute('data-t')) || 0;
          if (vid.getAttribute('src')) { vid.currentTime = t; vid.play().catch(function () {}); }
        });
      });
      vid.ontimeupdate = function () {
        var t = vid.currentTime, idx = 0;
        shots.forEach(function (s, i) {
          if (t + 0.5 >= (parseFloat(s.getAttribute('data-t')) || 0)) idx = i;
        });
        setCur(idx);
        if (subtitle) subtitle.textContent = (subOn && curCaptions[idx]) ? curCaptions[idx] : '';
      };
    }

    function renderShots(list) {
      strip.innerHTML = '';
      list.forEach(function (item, i) {
        var d = document.createElement('div');
        d.className = 'shot' + (i === 0 ? ' cur' : '');
        d.setAttribute('data-t', item[1]);
        d.innerHTML = '<div class="shot-thumb">' + (i + 1) + '</div><div class="shot-lbl">' + item[0] + '</div>';
        strip.appendChild(d);
      });
      bindShots();
    }

    function select(key) {
      var p = DATA[key];
      projects.forEach(function (el) {
        el.classList.toggle('cur', el.getAttribute('data-proj') === key);
      });
      tag.textContent = p.tag;
      curCaptions = p.captions || [];
      if (subtitle) subtitle.textContent = '';
      if (p.video) {
        hint.style.display = 'none';
        vid.style.display = 'block';
        if (vid.getAttribute('src') !== p.video) {
          vid.setAttribute('src', p.video);
          vid.setAttribute('poster', p.poster);
          vid.load();
        }
      } else {
        vid.style.display = 'none';
        hint.style.display = 'flex';
      }
      renderShots(p.shots);
    }

    projects.forEach(function (el) {
      el.addEventListener('click', function () {
        select(el.getAttribute('data-proj'));
      });
    });

    // 字幕开关：有 / 无
    if (subBtn) {
      subBtn.addEventListener('click', function () {
        subOn = !subOn;
        subBtn.classList.toggle('on', subOn);
        if (subtitle) subtitle.textContent = '';
      });
    }

    // 全屏开关：全屏 / 非全屏
    if (fullBtn && previewBox) {
      fullBtn.addEventListener('click', function () {
        if (document.fullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
        } else if (previewBox.requestFullscreen) {
          previewBox.requestFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', function () {
        var isFs = !!document.fullscreenElement;
        fullBtn.classList.toggle('on', isFs);
        if (fullLabel) fullLabel.textContent = isFs ? '退出全屏' : '全屏';
      });
    }

    select('macau');
  })();
